spring:
  application:
    name: petshop-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/petshop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:000000}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Email Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:sonlethai456@gmail.com}
    password: ${MAIL_PASSWORD:qcvb nlik afly xsdu}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    check-template-location: true

server:
  port: 8080

# JWT Configuration
jwt:
  # NOTE: JwtTokenProvider expects this secret to be BASE64 encoded.
  # Provide JWT_SECRET as a base64 string in env. Default below is dev-only.
  secret: ${JWT_SECRET:cGV0c2hvcC1kZXYtc2VjcmV0LWtleS1wbGVhc2UtY2hhbmdlLW1lLTEyMzQ1Ng==}
  expiration: 86400000 # 24 hours in milliseconds

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging
logging:
  level:
    com.petshop: DEBUG
    org.springframework.security: DEBUG

# Pet Shop Specific Configuration
petshop:
  booking:
    max-slots-per-timeslot: 3 # Số thú cưng tối đa cho mỗi khung giờ

  points:
    earn-rate: 1000 # 1000 VND = 1 điểm
    redeem-value: 100 # 1 điểm = 100 VND
  verification:
    microsoft:
      required: ${MICROSOFT_EMAIL_REQUIRED:false}
    mock-authenticator: ${MOCK_MICROSOFT_AUTHENTICATOR:true}

  appointment:
    slot-duration: 30 # minutes
    advance-booking-days: 30 # Đặt trước tối đa 30 ngày
    min-booking-hours: 2 # Đặt trước ít nhất 2 giờ

  # Spa Reminder Configuration
  reminder:
    enabled: ${REMINDER_ENABLED:true}
    cron: "0 0 9 * * *"
    default-days: 14
    from-email: ${MAIL_USERNAME:sonlethai456@gmail.com}
    from-name: "PetShop Spa"
    booking-url: ${BOOKING_URL:http://localhost:3000/booking}
    rules:
      dog-long-hair: 14
      dog-short-hair: 21
      cat: 21
      default: 14

  deposit:
    percentage: 30
    min-amount: 50000
    timeout-minutes: 15
    refund-before-hours: 24

