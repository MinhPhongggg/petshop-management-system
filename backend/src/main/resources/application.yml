spring:
  application:
    name: petshop-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/petshop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:000000}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# JWT Configuration
jwt:
  # NOTE: JwtTokenProvider expects this secret to be BASE64 encoded.
  # Provide JWT_SECRET as a base64 string in env. Default below is dev-only.
  secret: ${JWT_SECRET:cGV0c2hvcC1kZXYtc2VjcmV0LWtleS1wbGVhc2UtY2hhbmdlLW1lLTEyMzQ1Ng==}
  expiration: 86400000 # 24 hours in milliseconds

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging
logging:
  level:
    com.petshop: DEBUG
    org.springframework.security: DEBUG

# Pet Shop Specific Configuration
petshop:
  points:
    earn-rate: 1000 # 1000 VND = 1 điểm
    redeem-value: 100 # 1 điểm = 100 VND
  verification:
    microsoft:
      required: ${MICROSOFT_EMAIL_REQUIRED:false}
    mock-authenticator: ${MOCK_MICROSOFT_AUTHENTICATOR:true}

  appointment:
    slot-duration: 30 # minutes
    advance-booking-days: 30 # Đặt trước tối đa 30 ngày
    min-booking-hours: 2 # Đặt trước ít nhất 2 giờ

  deposit:
    percentage: 30 # Tỷ lệ cọc 30% tổng giá dịch vụ
    min-amount: 50000 # Số tiền cọc tối thiểu (VND)
    timeout-minutes: 15 # Hết hạn thanh toán sau 15 phút
    refund-before-hours: 24 # Hoàn 100% nếu hủy trước 24h

# MoMo Payment Configuration (Sandbox/Test)
momo:
  partner-code: ${MOMO_PARTNER_CODE:MOMOBKUN20180529}
  access-key: ${MOMO_ACCESS_KEY:klm05TvNBzhg7h7j}
  secret-key: ${MOMO_SECRET_KEY:at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa}
  api-url: ${MOMO_API_URL:https://test-payment.momo.vn/v2/gateway/api}
  redirect-url: ${MOMO_REDIRECT_URL:http://localhost:3000/booking/momo-result}
  ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/payments/momo/ipn}
  mock-enabled: ${MOMO_MOCK_ENABLED:false}
